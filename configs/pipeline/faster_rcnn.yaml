model: faster_rcnn
architecture: fasterrcnn_resnet50_fpn_COCO_V1
classes:
- deburring
- inclusion
- rolled_pit
- silk_spot
- waist_folding
seed: 42
data: data/raw
verify_reference_dataset: true
checkpoint: results/colab_results/content/results/faster_rcnn/model.pth
checkpoint_sha256: 0d7c90200d1bdb7ae618a5c9c0801d0921ce7f0d672c0e1cd9dfb3992bac96b7
training:
  epochs: 10
  batch: 1
  gradient_accumulation: 4
  optimizer: SGD
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
inference:
  min_confidence: 0.001
  nms_iou: 0.7
  max_detections: 300
  batch: 1
  resize: native min=800,max=1333
  precision: float32
runtime_backend:
  cudnn_deterministic: true
  cudnn_benchmark: false
  cudnn_enabled: true
  cudnn_allow_tf32: true
  cuda_matmul_allow_tf32: false
  float32_matmul_precision: highest
  deterministic_algorithms: false
