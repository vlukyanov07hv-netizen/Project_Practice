model: yolo_n
architecture: yolov8n.pt
classes:
- deburring
- inclusion
- rolled_pit
- silk_spot
- waist_folding
seed: 42
data: data/raw
verify_reference_dataset: true
checkpoint: results/yolo_baseline-3/weights/best.pt
checkpoint_sha256: 75712e37567ad6ccf9a59090e7ff64652739d7b4659707aa9cb034012860a4ed
training:
  epochs: 50
  batch: 16
  ultralytics_args:
    mosaic: 1.0
    mixup: 0.0
    degrees: 0.0
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    fliplr: 0.5
inference:
  min_confidence: 0.001
  nms_iou: 0.7
  max_detections: 300
  batch: 4
  resize: 640x640 letterbox; rect=False
  precision: float32
runtime_backend:
  cudnn_deterministic: true
  cudnn_benchmark: false
  cudnn_enabled: true
  cudnn_allow_tf32: true
  cuda_matmul_allow_tf32: false
  float32_matmul_precision: highest
  deterministic_algorithms: false
