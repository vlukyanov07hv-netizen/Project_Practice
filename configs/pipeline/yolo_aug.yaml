model: yolo_aug
architecture: yolov8n.pt
classes:
- deburring
- inclusion
- rolled_pit
- silk_spot
- waist_folding
seed: 42
data: data/raw
verify_reference_dataset: true
checkpoint: results/yolo_augmented/weights/best.pt
checkpoint_sha256: b9afa84b89ca87d69c0b58d49db4175d5bafa6283d393cb113b93692fdd69484
training:
  epochs: 50
  batch: 16
  ultralytics_args:
    mosaic: 1.0
    mixup: 0.1
    degrees: 10.0
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    fliplr: 0.5
inference:
  min_confidence: 0.001
  nms_iou: 0.7
  max_detections: 300
  batch: 4
  resize: 640x640 letterbox; rect=False
  precision: float32
runtime_backend:
  cudnn_deterministic: true
  cudnn_benchmark: false
  cudnn_enabled: true
  cudnn_allow_tf32: true
  cuda_matmul_allow_tf32: false
  float32_matmul_precision: highest
  deterministic_algorithms: false
